{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Something went wrong · Botlhami</title>
  <link rel="icon" href="{% static 'img/botlhami-mark.svg' %}" type="image/svg+xml">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <script src="{% static 'js/theme.js' %}"></script>
</head>
<body>
  <div class="weave-band" aria-hidden="true"></div>
  <main id="main" class="container">
    <section class="card narrow center error-page">
      <img src="{% static 'img/botlhami-mark.svg' %}" alt="" width="56" height="56">
      <h1>Something went wrong on our side</h1>
      <p class="muted">Nothing you did caused this. The error has been logged so the team can fix it. Go back and try again, or come back in a few minutes.</p>
      <p><a class="btn btn-primary" href="/">Go to the home page</a></p>
    </section>
  </main>
</body>
</html>
