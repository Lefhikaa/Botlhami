<div class="field{% if field.errors %} has-error{% endif %}">
  {% if field.field.widget.input_type == "checkbox" %}
    <label class="check">{{ field }} <span>{{ field.label }}{% if field.field.required or field.field.mandatory %} <span class="req" aria-hidden="true">*</span>{% endif %}</span></label>
  {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required or field.field.mandatory %} <span class="req" aria-hidden="true">*</span>{% endif %}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<small class="hint">{{ field.help_text|safe }}</small>{% endif %}
  {% for e in field.errors %}<small class="error">{{ e }}</small>{% endfor %}
</div>
